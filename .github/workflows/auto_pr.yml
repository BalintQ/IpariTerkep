name: Auto PR to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  BASE_BRANCH: main
  EXCLUDED_BRANCHES: "main Fo"
  DAYS: 7

jobs:
  create-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PRs for branches without a recent PR
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "${DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff: $cutoff"

          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ \
            | grep -v '^HEAD$' \
            | while read -r branch; do

            skip=false
            for ex in $EXCLUDED_BRANCHES; do
              [ "$branch" = "$ex" ] && skip=true
            done
            if $skip; then
              echo "[$branch] excluded"
              continue
            fi

            ahead=$(git rev-list --count "origin/${BASE_BRANCH}..origin/${branch}")
            if [ "$ahead" -eq 0 ]; then
              echo "[$branch] no commits ahead of ${BASE_BRANCH}, skipping"
              continue
            fi

            recent=$(gh pr list \
              --head "$branch" \
              --state all \
              --limit 100 \
              --json createdAt \
              --jq "[.[] | select(.createdAt >= \"${cutoff}\")] | length")

            if [ "$recent" -gt 0 ]; then
              echo "[$branch] PR already created in the last ${DAYS} days, skipping"
              continue
            fi

            echo "[$branch] creating PR -> ${BASE_BRANCH}"
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "Merge ${branch} into ${BASE_BRANCH}" \
              --body "Automatically created because no PR for \`${branch}\` existed in the last ${DAYS} days. \n Autocreated at: $(date)" \
              || echo "[$branch] PR creation failed, continuing"
          done
